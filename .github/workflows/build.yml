name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Extract ZIP
        run: |
          unzip -o .github/*.zip

      - name: Find Gradle project
        run: |
          echo "Buscando gradlew..."
          find . -name gradlew -type f

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find . -name gradlew -type f | head -1)")
          echo "Proyecto encontrado en: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HoloAimPanel-debug
          path: '**/app/build/outputs/apk/debug/*.apk'

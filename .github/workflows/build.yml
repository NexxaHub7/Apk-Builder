name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Extract project
        run: |
          unzip -o .github/HoloAimPanel.zip
          
      - name: Build APK
        working-directory: HoloAimPanel
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HoloAimPanel-debug
          path: HoloAimPanel/app/build/outputs/apk/debug/*.apk
